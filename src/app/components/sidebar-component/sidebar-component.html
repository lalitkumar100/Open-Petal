<div class="flex min-h-full h-full flex-col items-start bg-primary/10 is-drawer-close:w-14 is-drawer-open:w-64 transition-all duration-300 border-r border-primary/20">

        <div class="flex items-center text-xl font-bold text-base-content gap-0.5">
            <!-- Loader.gif serving as the 'O' -->
            <img src="/loader.gif" alt="O" class="w-7 h-7 object-contain shrink-0" />

    <!-- Sidebar content here -->

                    <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                    <polyline points="9 22 9 12 15 12 15 22" />
                </svg>
                <span class="is-drawer-close:hidden font-semibold">Homepage</span>

        </li>

        <!-- List item -->
        <li>
            <button class="is-drawer-close:tooltip is-drawer-close:tooltip-right !rounded-none hover:text-primary" data-tip="Settings">

                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="my-1.5 inline-block size-5">

                <span class="is-drawer-close:hidden font-semibold">Settings</span>

        </li>
    </ul>

    <!-- Footer with Profile Avatar and Logout -->
    <div class="p-2 border-t border-base-300 w-full shrink-0 flex flex-col gap-2">
        <!-- Profile Info Button -->
        <button routerLink="/profile" class="is-drawer-close:tooltip is-drawer-close:tooltip-right btn btn-ghost h-auto flex items-center p-2 w-full justify-start is-drawer-close:justify-center overflow-hidden !rounded-none normal-case hover:text-primary" data-tip="Profile">
            <div class="avatar placeholder shrink-0">
                <div class="bg-neutral text-neutral-content w-8 h-8 flex items-center justify-center !rounded-none">
                    <span class="text-xs font-bold">UI</span>
                </div>
            </div>
            <div class="is-drawer-close:hidden flex flex-col ml-3 text-left overflow-hidden min-w-0">

                <span class="text-base-content/60 text-xs truncate leading-tight mt-0.5">admin@openpetal.com</span>
            </div>
        </button>

        <!-- Logout Button -->
        <button class="btn btn-ghost text-error hover:bg-error/10 w-full justify-start !rounded-none px-2 is-drawer-close:justify-center">

            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="my-1.5 inline-block size-5 shrink-0">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />

                <line x1="21" x2="9" y1="12" y2="12" />
