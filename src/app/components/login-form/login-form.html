<!-- Subtle background overlay for glassmorphism feel -->
<div class="absolute inset-0 bg-gradient-to-br from-primary/10 to-transparent pointer-events-none"></div>
<div class="w-full max-w-md relative z-10 bg-on-secondary-fixed-variant/40 p-6 rounded-xl border border-outline-variant/20 backdrop-blur-md shadow-2xl mx-auto">
  <div class="flex flex-col items-center mb-6">
    <img alt="Open Petal Logo" class="w-24 h-auto mb-6 animate-[spin_8s_linear_infinite]" src="/logo.svg"/>
    <h1 class="font-display-lg text-display-lg text-tertiary-fixed font-bold tracking-tight text-center">Welcome Back</h1>
    <p class="font-body-md text-body-md text-secondary-fixed-dim mt-2 text-center">Sign in to continue to Open Petal.</p>
  </div>
  <form class="flex flex-col w-full space-y-1 mt-2" (ngSubmit)="onSubmit()">
    <!-- Error message display -->
    <div *ngIf="errorMessage" class="text-sm text-error bg-error/10 p-2 rounded mb-2 border border-error/20">
      {{ errorMessage }}
    </div>
    
    <!-- Email Input -->
    <div class="form-control w-full">
      <label class="label py-1"><span class="label-text font-medium text-base-content/80">Email Address</span></label>
      <label class="input input-bordered flex items-center gap-2 !rounded-none bg-transparent validator">
        <mat-icon class="h-[1em] opacity-50">mail</mat-icon>
        <input type="email" class="grow" placeholder="mail@site.com" id="email" name="email" [(ngModel)]="email" required />
      </label>
      <div class="validator-hint hidden text-xs mt-1 text-error">Enter valid email address</div>
    </div>

    <!-- Password Input -->
    <div class="form-control w-full mt-2">
      <label class="label py-1"><span class="label-text font-medium text-base-content/80">Password</span></label>
      <label class="input input-bordered flex items-center gap-2 !rounded-none bg-transparent validator">
        <mat-icon class="h-[1em] opacity-50">lock</mat-icon>
        <input type="password" class="grow" placeholder="Password" id="password" name="password" [(ngModel)]="password" required minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}" title="Must be more than 8 characters, including number, lowercase letter, uppercase letter" />
        <button type="button" class="btn btn-ghost btn-xs btn-square">
          <!-- lucide: eye -->
          <mat-icon class="w-4 h-4 opacity-70" style="font-size: 1rem; width: 1rem; height: 1rem; line-height: 1rem;">visibility</mat-icon>
        </button>
      </label>
      <p class="validator-hint hidden text-xs mt-1 text-error leading-tight">
        Must be more than 8 characters, including<br />
        At least one number<br />
        At least one lowercase letter<br />
        At least one uppercase letter
      </p>
    </div>

    <!-- Remember Me / Forgot Password -->
    <div class="flex items-center justify-between pb-4 mt-2">
      <label class="label cursor-pointer justify-start gap-2">
        <input type="checkbox" class="checkbox checkbox-primary checkbox-sm !rounded-none" name="rememberMe" [(ngModel)]="rememberMe" />
        <span class="label-text text-secondary-fixed-dim">Remember me</span>
      </label>
      <a class="font-label-sm text-label-sm text-tertiary-fixed hover:text-tertiary-fixed-dim transition-colors" routerLink="/forgot-password">Forgot Password?</a>
    </div>

    <!-- Actions -->
    <div class="flex flex-col gap-3 mt-2">
      <button class="btn btn-primary w-full !rounded-none !h-12 text-[16px] glow-effect" type="submit" [disabled]="isLoading">
        <span *ngIf="isLoading" class="loading loading-spinner"></span>
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>
      <button class="btn btn-outline w-full !rounded-none !h-12 text-[16px] text-on-primary bg-transparent" type="button">
        Sign up with Google
      </button>
    </div>
  </form>
  <div class="mt-8 text-center">
    <p class="font-body-md text-body-md text-secondary-fixed-dim">
      Don't have an account? 
      <a class="text-tertiary-fixed hover:text-tertiary-fixed-dim font-medium transition-colors ml-1" routerLink="/register">Sign Up</a>
    </p>
  </div>
</div>
