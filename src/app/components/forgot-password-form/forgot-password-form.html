<div class="absolute inset-0 bg-gradient-to-br from-primary/10 to-transparent pointer-events-none"></div>
<div
  class="w-full max-w-md relative z-10 bg-on-secondary-fixed-variant/40 p-6 rounded-xl border border-outline-variant/20 backdrop-blur-md shadow-2xl mx-auto">
  <div class="flex flex-col items-center mb-6">
    <img alt="Open Petal Logo" class="w-24 h-auto mb-6 animate-[spin_8s_linear_infinite]"
      src="/logo.svg" />
    <h1 class="font-display-lg text-[32px] leading-tight text-tertiary-fixed font-bold tracking-tight text-center">Reset
      Password</h1>
    <p class="font-body-md text-body-md text-secondary-fixed-dim mt-2 text-center">Enter your email to receive a reset
      link.</p>
  </div>
  
  <!-- Success State -->
  <div *ngIf="isSuccess" class="flex flex-col items-center mt-4">
    <div class="text-success bg-success/10 p-4 rounded-lg w-full text-center border border-success/20 mb-6 font-medium">
      {{ successMessage }}
    </div>
    <button class="btn btn-primary w-full !rounded-none !h-12 text-[16px] glow-effect" (click)="goToLogin()">
      Back to Login
    </button>
  </div>

  <form *ngIf="!isSuccess" class="flex flex-col w-full space-y-2 mt-4" (ngSubmit)="onSubmit()">
    <!-- Error message display -->
    <div *ngIf="errorMessage" class="text-sm text-error bg-error/10 p-2 rounded mb-2 border border-error/20">
      {{ errorMessage }}
    </div>
    
    <!-- Email Input -->
    <div class="form-control w-full">
      <label class="label py-1"><span class="label-text font-medium text-base-content/80">Email Address</span></label>
      <label class="input input-bordered flex items-center gap-2 !rounded-none bg-transparent validator">
        <mat-icon class="h-[1em] opacity-50">mail</mat-icon>
        <input type="email" class="grow" placeholder="mail@site.com" id="email" name="email" [(ngModel)]="email" required />
      </label>
      <div class="validator-hint hidden text-xs mt-1 text-error">Enter valid email address</div>
    </div>

    <!-- Actions -->
    <div class="pt-2">
      <button class="btn btn-primary w-full !rounded-none !h-12 text-[16px] glow-effect" type="submit" [disabled]="isLoading">
        <span *ngIf="isLoading" class="loading loading-spinner"></span>
        {{ isLoading ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </div>
  </form>
  <div class="mt-8 text-center">
    <p class="font-body-md text-body-md text-secondary-fixed-dim">
      Remember your password?
      <a class="text-tertiary-fixed hover:text-tertiary-fixed-dim font-medium transition-colors ml-1"
        routerLink="/login">Sign In</a>
    </p>
  </div>
</div>
