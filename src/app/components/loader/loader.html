<div *ngIf="isLoading" 
     [ngClass]="{
       'absolute inset-0 z-50 bg-sky-950/70 backdrop-blur-md': mode === 'page',
       'absolute inset-0 z-20 bg-sky-950/50 backdrop-blur-[2px]': mode === 'inline',
       'fixed inset-0 z-50 bg-sky-950/80 backdrop-blur-lg': mode === 'global'
     }"
     class="flex flex-col items-center justify-center transition-all duration-300">
  
  <div class="flex flex-col items-center gap-3 p-4">
    
    <div *ngIf="!isGifLoaded" class="w-10 h-10 border-4 border-sky-400 border-t-transparent rounded-none animate-spin"></div>

    <img src="/loader.gif" 
         alt="Loading..." 
         class="w-16 h-16 object-contain"
         [class.hidden]="!isGifLoaded"
         (load)="onGifLoad()"
         (error)="onGifError()" />
    
    <span *ngIf="message" class="text-xs font-semibold text-white tracking-wider uppercase mt-1">
      {{ message }}
    </span>
  </div>
</div>
