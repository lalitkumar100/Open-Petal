<div *ngIf="isLoading" class="flex items-center justify-center transition-all duration-300"
     [ngClass]="{
       'absolute inset-0 z-50': mode === 'page',
       'absolute inset-0 z-20 rounded-[inherit] overflow-hidden': mode === 'inline',
       'fixed inset-0 z-[9999]': mode === 'global',
       'relative py-12': mode === 'flow'
     }">
  
  <!-- Backdrop -->
  <div *ngIf="mode !== 'flow'" class="absolute inset-0 transition-opacity duration-300"
       [ngClass]="{
         'bg-base-300/40 backdrop-blur-sm': mode === 'page',
         'bg-base-100/50 backdrop-blur-[2px]': mode === 'inline',
         'bg-base-300/70 backdrop-blur-md': mode === 'global'
       }"></div>

  <!-- Loader Box -->
  <div class="relative z-10 flex flex-col items-center gap-4"
       [ngClass]="{
         'p-6': mode !== 'inline',
         'p-3': mode === 'inline'
       }">
    
    <!-- GIF Loader -->
    <img src="/loader.gif" 
         alt="Loading..." 
         class="object-contain"
         [ngClass]="size || ((mode === 'inline' || mode === 'flow') ? 'w-10 h-10' : 'w-16 h-16')"
         [class.hidden]="!isGifLoaded"
         (load)="onGifLoad()"
         (error)="onGifError()" />
         
    <!-- Fallback Custom Spinner (if GIF fails to load) -->
    <div *ngIf="!isGifLoaded" class="relative flex items-center justify-center"
         [ngClass]="size || ((mode === 'inline' || mode === 'flow') ? 'w-10 h-10' : 'w-16 h-16')">
      <div class="absolute inset-0 rounded-full border-4 border-primary/20"></div>
      <div class="absolute inset-0 rounded-full border-4 border-primary border-t-transparent animate-spin"></div>
    </div>
    
    <span *ngIf="message" class="font-bold text-base-content/80 tracking-wider uppercase animate-pulse"
          [ngClass]="mode === 'inline' ? 'text-[10px]' : 'text-xs'">
      {{ message }}
    </span>
  </div>
</div>
